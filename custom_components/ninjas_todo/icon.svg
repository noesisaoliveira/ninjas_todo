<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- App Icon Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="6" y="6" width="244" height="244" rx="52" ry="52" />
    </clipPath>

    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0E4A3E" />
      <stop offset="55%" stop-color="#072227" />
      <stop offset="100%" stop-color="#030D14" />
    </radialGradient>

    <!-- Gold/Orange Emblem & NINJAS Text Gradient -->
    <linearGradient id="goldOrangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE652" />
      <stop offset="50%" stop-color="#FF9E1B" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Fresh Produce Leaf Green Gradient -->
    <linearGradient id="leafGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6F750" />
      <stop offset="50%" stop-color="#38B000" />
      <stop offset="100%" stop-color="#006400" />
    </linearGradient>

    <!-- Metallic Dark Slate Hood Gradient -->
    <linearGradient id="hoodGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#606E73" />
      <stop offset="45%" stop-color="#364145" />
      <stop offset="100%" stop-color="#192023" />
    </linearGradient>

    <!-- Mask Metallic Gradient -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76848A" />
      <stop offset="50%" stop-color="#3C464A" />
      <stop offset="100%" stop-color="#1D2427" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5A27A" />
      <stop offset="55%" stop-color="#F7C49F" />
      <stop offset="100%" stop-color="#C9825B" />
    </linearGradient>

    <!-- Outer Aura Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Deep Emerald-Navy Squircle Background -->
    <rect x="6" y="6" width="244" height="244" fill="url(#bgGrad)" />

    <!-- Subtle Circuit Trace Lines -->
    <g stroke="#16695B" stroke-width="1" fill="none" opacity="0.35">
      <path d="M 15 45 L 45 75 L 45 120 L 25 140" />
      <circle cx="45" cy="75" r="2.2" fill="#072227" />
      <path d="M 35 15 L 70 50 L 105 50" />
      <circle cx="70" cy="50" r="2.2" fill="#072227" />
      <path d="M 240 55 L 210 85 L 210 135 L 235 160" />
      <circle cx="210" cy="85" r="2.2" fill="#072227" />
      <path d="M 225 15 L 190 50" />
      <path d="M 18 180 L 42 156 L 42 125" />
      <path d="M 238 185 L 212 159 L 212 130" />
    </g>

    <!-- Fresh Leaves & Botanical Flourishes (Left & Right) -->
    <g stroke="#081C15" stroke-width="2" stroke-linejoin="round">
      <!-- Left Leaves -->
      <path d="M 72 82 C 55 72, 50 52, 62 38 C 75 50, 78 68, 72 82 Z" fill="url(#leafGreenGrad)" />
      <path d="M 65 74 L 63 48" stroke="#1B4332" stroke-width="1.3" fill="none" />

      <path d="M 68 125 C 44 115, 34 95, 42 78 C 58 88, 66 108, 68 125 Z" fill="url(#leafGreenGrad)" />
      <path d="M 61 117 L 46 88" stroke="#1B4332" stroke-width="1.3" fill="none" />

      <path d="M 66 146 C 42 146, 26 130, 28 112 C 46 114, 58 130, 66 146 Z" fill="url(#leafGreenGrad)" />
      <path d="M 59 141 L 34 119" stroke="#1B4332" stroke-width="1.3" fill="none" />

      <!-- Left Golden Swirl & Dots -->
      <path d="M 75 162 C 42 156, 24 126, 26 95 C 32 122, 48 144, 78 152 Z" fill="url(#goldOrangeGrad)" stroke="none" />
      <circle cx="31" cy="91" r="3" fill="#FFE652" stroke="none" />
      <circle cx="36" cy="103" r="2.2" fill="#A6F750" stroke="none" />

      <!-- Right Leaves & Herbs -->
      <path d="M 184 95 C 194 78, 206 70, 212 68 C 208 82, 198 92, 184 95 Z" fill="url(#leafGreenGrad)" />
      <path d="M 184 128 C 204 104, 224 84, 236 74 C 226 98, 208 118, 188 134 Z" fill="url(#leafGreenGrad)" />
      <path d="M 186 142 C 208 124, 226 112, 240 105 C 228 124, 210 138, 186 148 Z" fill="url(#leafGreenGrad)" />

      <!-- Oak/Arugula Leaf & Golden Accent Right -->
      <path d="M 184 155 C 195 145, 202 135, 212 135 C 216 135, 214 143, 218 144 C 223 145, 224 152, 216 156 C 210 160, 196 164, 182 164 Z" fill="url(#leafGreenGrad)" />
      <path d="M 178 166 C 205 162, 224 148, 232 130 C 228 154, 206 168, 174 170 Z" fill="url(#goldOrangeGrad)" stroke="none" />
      <circle cx="226" cy="112" r="2.8" fill="#FFE652" stroke="none" />
      <circle cx="232" cy="122" r="2" fill="#FFE652" stroke="none" />
    </g>

    <!-- Ninja Character Group with Vibrant Rim Outline -->
    <g stroke="#0A1619" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">

      <!-- Sword Hilt / Scabbard Behind Right Shoulder -->
      <g transform="translate(178, 38) rotate(42)">
        <rect x="-12" y="-14" width="24" height="10" rx="3" fill="url(#hoodGrad)" />
        <line x1="-6" y1="-14" x2="-6" y2="-4" stroke="#89C2D9" stroke-width="2" />
        <line x1="0" y1="-14" x2="0" y2="-4" stroke="#192023" stroke-width="2" />
        <line x1="6" y1="-14" x2="6" y2="-4" stroke="#FF9E1B" stroke-width="2" />
        <rect x="-15" y="-4" width="30" height="7" rx="2" fill="#2A3439" />
        <rect x="-11" y="3" width="22" height="16" fill="url(#hoodGrad)" />
        <path d="M 6 3 L 11 3 L 11 19 L 6 19 Z" fill="#FF9E1B" stroke="none" />
      </g>

      <!-- Shoulders / Collar Armor -->
      <path d="M 52 152 L 84 138 L 128 156 L 172 138 L 204 152 L 182 174 C 148 182, 108 182, 74 174 Z" fill="url(#hoodGrad)" />
      <!-- Left Neon Green Rim on Shoulder -->
      <path d="M 56 152 L 83 140 L 92 166 L 75 171 Z" fill="none" stroke="#7AE538" stroke-width="2" />
      <!-- Right Warm Orange Rim on Shoulder -->
      <path d="M 200 152 L 173 140 L 164 166 L 181 171 Z" fill="none" stroke="#FF9E1B" stroke-width="2" />

      <!-- Main Ninja Hood Dome -->
      <path d="M 73 95 C 70 50, 96 22, 128 22 C 160 22, 186 50, 183 95 L 176 135 C 162 158, 94 158, 80 135 Z" fill="url(#hoodGrad)" />

      <!-- Rim Highlights on Hood (Green Left, Orange Right) -->
      <path d="M 76 76 C 77 45, 99 25, 128 25" fill="none" stroke="#80ED49" stroke-width="2.5" />
      <path d="M 128 25 C 157 25, 179 45, 180 76" fill="none" stroke="#FF9E1B" stroke-width="2.5" />

      <!-- Glossy Specular Highlights on Forehead Dome -->
      <path d="M 88 53 C 93 43, 102 37, 111 35" fill="none" stroke="#BCE0FD" stroke-width="4" stroke-linecap="round" opacity="0.85" />
      <circle cx="117" cy="34" r="1.8" fill="#BCE0FD" stroke="none" opacity="0.85" />

      <!-- Headband Strap -->
      <path d="M 72 78 Q 128 66 184 78 L 182 94 Q 128 82 74 94 Z" fill="#2A3337" />
      <path d="M 74 79 Q 100 73 128 73" fill="none" stroke="#80ED49" stroke-width="2.2" />
      <path d="M 128 73 Q 156 73 182 79" fill="none" stroke="#FF9E1B" stroke-width="2.2" />
      <path d="M 75 93 Q 100 87 128 87" fill="none" stroke="#80ED49" stroke-width="2" />
      <path d="M 128 87 Q 156 87 181 93" fill="none" stroke="#FF9E1B" stroke-width="2" />

      <!-- Face Skin Opening -->
      <path d="M 81 92 Q 128 83 175 92 C 176 106, 170 116, 158 118 C 144 114, 134 109, 128 109 C 122 109, 112 114, 98 118 C 86 116, 80 106, 81 92 Z" fill="url(#skinGrad)" />

      <!-- Nose Bridge Shading -->
      <path d="M 122 97 L 120 108 L 136 108 L 134 97" fill="#C9825B" stroke="none" opacity="0.6" />

      <!-- Fierce Eyes & Eyebrows -->
      <!-- Left Eye -->
      <path d="M 90 100 Q 103 98 115 104 Q 103 111 91 104 Z" fill="#FFFFFF" stroke-width="1.8" />
      <circle cx="104" cy="103" r="4.2" fill="#0B1316" stroke="none" />
      <circle cx="102.5" cy="101.5" r="1.5" fill="#FFFFFF" stroke="none" />
      <!-- Left Eyebrow -->
      <path d="M 87 96 L 106 95 L 122 103 L 119 106 L 105 99 L 88 99 Z" fill="#0B1316" stroke="none" />

      <!-- Right Eye -->
      <path d="M 166 100 Q 153 98 141 104 Q 153 111 165 104 Z" fill="#FFFFFF" stroke-width="1.8" />
      <circle cx="152" cy="103" r="4.2" fill="#0B1316" stroke="none" />
      <circle cx="153.5" cy="101.5" r="1.5" fill="#FFFFFF" stroke="none" />
      <!-- Right Eyebrow -->
      <path d="M 169 96 L 150 95 L 134 103 L 137 106 L 151 99 L 168 99 Z" fill="#0B1316" stroke="none" />

      <!-- Respirator / Armor Face Mask -->
      <path d="M 80 106 C 95 117, 114 114, 128 109 C 142 114, 161 117, 176 106 C 178 134, 160 158, 128 168 C 96 158, 78 134, 80 106 Z" fill="url(#maskGrad)" />
      <!-- Mask Rim Highlights -->
      <path d="M 82 108 C 80 133, 97 156, 128 166" fill="none" stroke="#80ED49" stroke-width="2" />
      <path d="M 174 108 C 176 133, 159 156, 128 166" fill="none" stroke="#FF9E1B" stroke-width="2" />

      <!-- Vertical Mask Vents -->
      <g fill="#0E1518" stroke="none">
        <rect x="125.5" y="121" width="5" height="34" rx="2.5" />
        <rect x="115.5" y="123" width="5" height="30" rx="2.5" />
        <rect x="135.5" y="123" width="5" height="30" rx="2.5" />
        <rect x="105.5" y="126" width="4.5" height="23" rx="2.2" />
        <rect x="146" y="126" width="4.5" height="23" rx="2.2" />
        <path d="M 95 127 C 98 127, 99 131, 99 136 C 99 140, 97 142, 95 141 C 93 137, 93 131, 95 127 Z" />
        <path d="M 161 127 C 158 127, 157 131, 157 136 C 157 140, 159 142, 161 141 C 163 137, 163 131, 161 127 Z" />
      </g>

      <!-- Forehead Plate & Supermarket Shopping Bag Emblem -->
      <g transform="translate(128, 65)">
        <!-- Bag Handle -->
        <path d="M -8 -14 V -18 A 8 8 0 0 1 8 -18 V -14" fill="none" stroke="#FFF3B0" stroke-width="5.5" />
        <path d="M -8 -14 V -18 A 8 8 0 0 1 8 -18 V -14" fill="none" stroke="url(#goldOrangeGrad)" stroke-width="3" />
        <!-- Bag Body -->
        <polygon points="-14,-14 14,-14 17,15 -17,15" fill="url(#goldOrangeGrad)" stroke="#FFF3B0" stroke-width="1.5" />
        <!-- Checkmark Inside Bag -->
        <path d="M -6 1 L -1 6 L 8 -4" fill="none" stroke="#13382C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Bottom Typography: SUPERMERCADOS NINJAS -->
    <g text-anchor="middle" font-family="&#39;Segoe UI&#39;, &#39;Arial Black&#39;, Impact, sans-serif" font-weight="900">
      <!-- SUPERMERCADOS (Crisp White) -->
      <text x="128" y="207" font-size="23.5" letter-spacing="0.4" fill="#FFFFFF" stroke="#030D14" stroke-width="3">
        SUPERMERCADOS
      </text>

      <!-- Stylized NINJAS Wordmark -->
      <g transform="translate(128, 236)" fill="url(#goldOrangeGrad)" stroke="#030D14" stroke-width="2.5">
        <!-- N -->
        <path d="M -64 -20 L -58 -20 L -46 -6 L -46 -20 L -40 -20 L -40 2 L -46 2 L -58 -12 L -58 2 L -64 2 Z" />
        <!-- I -->
        <path d="M -33 -20 L -27 -20 L -27 2 L -33 2 Z" />
        <!-- N -->
        <path d="M -20 -20 L -14 -20 L -2 -6 L -2 -20 L 4 -20 L 4 2 L -2 2 L -14 -12 L -14 2 L -20 2 Z" />
        <!-- J -->
        <path d="M 18 -20 L 24 -20 L 24 -4 C 24 1, 20 3, 14 3 C 10 3, 8 1, 7 -2 L 12 -4 C 13 -2, 14 -2, 16 -2 C 17 -2, 18 -3, 18 -5 Z" />
        <!-- A (Custom Ninja Katana Crossbar) -->
        <path d="M 38 -22 L 42 -22 L 52 2 L 45 2 L 43 -4 L 35 -4 L 33 2 L 27 2 Z M 37 -9 L 41 -9 L 39 -15 Z" />
        <path d="M 28 -11 L 50 -11" stroke="url(#goldOrangeGrad)" stroke-width="2.4" />
        <!-- S -->
        <path d="M 55 -14 C 55 -18, 59 -20, 64 -20 C 69 -20, 72 -18, 73 -15 L 67 -14 C 66 -15, 65 -16, 63 -16 C 61 -16, 60 -15, 60 -14 C 60 -12, 73 -12, 73 -4 C 73 1, 69 3, 63 3 C 58 3, 55 0, 54 -3 L 60 -4 C 61 -2, 62 -2, 64 -2 C 66 -2, 67 -3, 67 -4 C 67 -7, 55 -6, 55 -14 Z" />
      </g>
    </g>
  </g>
</svg>